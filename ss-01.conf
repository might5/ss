# Shadowrocket 本地扩展配置
# 文件：ss-01.conf
# 用途：本地策略组定义
# 请在 Shadowrocket 中设置本配置「包含配置」= ss.conf
# 订阅选择在每个策略组的图形界面中开启「订阅」并勾选订阅
# 不写入任何订阅备注名或具体节点名

[Proxy Group]

# 01 回家网络
# 在此组开启「订阅」，选择包含回家节点的订阅；DIRECT 保留为备用
GO home = select,DIRECT

# 02 主策略
🚀 策略选择 = select,DIRECT

# 03 AI 服务
🤖️ 人工智能 = select,DIRECT

# 04 TikTok
📱 TikTok = select,DIRECT

# 05 社交服务
📲 Telegram = select,DIRECT
📄 Twitter = select,DIRECT

# 06 视频和音乐
📹 YouTube = select,DIRECT
🎥 Netflix = select,DIRECT
🎬 Disney+ = select,DIRECT
🎻 Spotify = select,DIRECT

# 07 苹果服务
🍎 苹果服务 = select,DIRECT

# 08 微软服务
Ⓜ️ 微软服务 = select,DIRECT

# 09 国内媒体
🍔 国内媒体 = select,DIRECT

# 10 国外媒体
🍿 国外媒体 = select,DIRECT

# 11 全部节点
# 先在此组开启「订阅」并选择需要测速的订阅。
# 当前先使用 select，避免把 DIRECT 当作测速节点。
# 如需自动测速，可在图形界面将此组类型改为 url-test，
# 再设置测试 URL、间隔和公差。
♻️ ALL = select,DIRECT
