# Shadowrocket 远程基础配置
# 文件：ss.conf
# 用途：DNS、网络参数、分流规则、URL Rewrite
# 策略组由本地扩展配置 ss-01.conf 提供
# 更新此文件不会覆盖本地扩展配置中的策略组订阅选择

[General]
bypass-system = true
skip-proxy = 192.168.0.0/16,172.16.0.0/12,localhost,*.local
tun-excluded-routes = 100.64.0.0/10,127.0.0.0/8,169.254.0.0/16,172.16.0.0/12,192.0.0.0/24,192.0.2.0/24,192.88.99.0/24,192.168.0.0/16,198.51.100.0/24,203.0.113.0/24,224.0.0.0/4,255.255.255.255/32,239.255.255.250/32
dns-server = 119.29.29.29,114.114.114.114,223.5.5.5,system
fallback-dns-server = system
ipv6 = false
prefer-ipv6 = false
dns-fallback-system = false
dns-direct-system = false
icmp-auto-reply = true
always-reject-url-rewrite = false
private-ip-answer = false
update-url = https://raw.githubusercontent.com/might5/ss/refs/heads/main/ss.conf


[Rule]

# 01 回家网络：最高优先级
IP-CIDR,10.9.9.0/24,GO home,no-resolve

# 02 AI 服务
RULE-SET,https://yfamilys.com/rule/ai.list,🤖️ 人工智能

# 03 TikTok
RULE-SET,https://yfamilys.com/rule/TikTok.list,📱 TikTok

# 04 社交服务
RULE-SET,https://yfamilys.com/rule/Telegram.list,📲 Telegram
RULE-SET,https://yfamilys.com/rule/Twitter.list,📄 Twitter
RULE-SET,https://yfamilys.com/rule/Facebook.list,🚀 策略选择
RULE-SET,https://yfamilys.com/rule/Reddit.list,🚀 策略选择
RULE-SET,https://yfamilys.com/rule/Discord.list,🚀 策略选择
RULE-SET,https://yfamilys.com/rule/WeChat.list,DIRECT

# 05 视频和音乐
RULE-SET,https://yfamilys.com/rule/YouTube.list,📹 YouTube
RULE-SET,https://yfamilys.com/rule/YouTubeMusic.list,📹 YouTube
RULE-SET,https://yfamilys.com/rule/Netflix.list,🎥 Netflix
RULE-SET,https://yfamilys.com/rule/Disney.list,🎬 Disney+
RULE-SET,https://yfamilys.com/rule/Spotify.list,🎻 Spotify
RULE-SET,https://yfamilys.com/rule/Twitch.list,🚀 策略选择

# 06 苹果服务
RULE-SET,https://yfamilys.com/rule/AppStore.list,🍎 苹果服务
RULE-SET,https://yfamilys.com/rule/AppleProxy.list,🚀 策略选择
RULE-SET,https://yfamilys.com/rule/Apple.list,🍎 苹果服务

# 07 微软服务
RULE-SET,https://yfamilys.com/rule/Microsoft.list,Ⓜ️ 微软服务

# 08 国内媒体
DOMAIN-SUFFIX,api.bilibili.com,🍔 国内媒体
RULE-SET,https://yfamilys.com/rule/BiliBili.list,🍔 国内媒体
RULE-SET,https://yfamilys.com/rule/ChinaMedia.list,🍔 国内媒体
RULE-SET,https://yfamilys.com/rule/Douyu.list,DIRECT

# 09 国外媒体
RULE-SET,https://yfamilys.com/rule/ProxyMedia.list,🍿 国外媒体

# 10 Google 服务
RULE-SET,https://yfamilys.com/rule/Google.list,🚀 策略选择

# 11 支付服务
RULE-SET,https://yfamilys.com/rule/PayPal.list,🚀 策略选择

# 12 广告拦截
# 放在通用代理规则之前，避免被宽泛代理规则提前命中
RULE-SET,https://yfamilys.com/rule/AntiAD.list,REJECT

# 13 中国大陆 IP 直连
RULE-SET,https://yfamilys.com/rule/ASN-CN.list,DIRECT

# 14 通用代理规则
RULE-SET,https://yfamilys.com/rule/Proxy.list,🚀 策略选择

# 15 最终兜底
FINAL,🚀 策略选择


[URL Rewrite]
'^https?://(www.)?g.cn' 'https://www.google.com' 302
'^https?://(www.)?google.cn' 'https://www.google.com' 302
